estimator:
  name: phase25_scenarios
  inference_scope: descriptive_and_design_based

edge_criteria:
  minimum_effect: 0.08
  minimum_complete_n: 500
  minimum_condition_cases: 30
  minimum_cooccurring_cases: 10
  require_fdr: false
  maximum_q_value: 0.05

node_criteria:
  minimum_valid_n: 500
  minimum_cases: 30

phase25:
  phi_rules:
    - rule_id: phi_008
      minimum_effect: 0.08
    - rule_id: phi_012
      minimum_effect: 0.12
  adjusted_rule:
    rule_id: adjusted_fdr
    confidence_level: 0.95
    maximum_q_value: 0.05
    fdr_scope: within_graph
    outcome_direction: condition_registry_order
    reverse_direction_diagnostic: true
  bootstrap:
    rule_id: adjusted_stable
    enabled: true
    ses_definition: education_binary
    replicates: 200
    type: bootstrap
    mse: true
    positive_stability_threshold: 0.90
    seed: 20240902
    calibration_only: true
    confirmation_replicates_minimum: 500
    confirmation_replicates_maximum: 1000
  similarity:
    permutations: 10000
    seed: 20240902
  calibration:
    preferred_edge_count_minimum: 10
    preferred_edge_count_maximum: 20
    maximum_density_caution: 0.70

visualization:
  width: 9
  height: 7
  dpi: 160

viability:
  minimum_eligible_graphs: 80
  minimum_unique_edge_fraction: 0.5
  preferred_median_density_minimum: 0.05
  preferred_median_density_maximum: 0.50
  density_caution_threshold: 0.70
