estimator:
  name: phase3_gspan
  inference_scope: exploratory_motif_discovery_and_robustness

edge_criteria:
  minimum_effect: 0.12
  minimum_complete_n: 500
  minimum_condition_cases: 30
  minimum_cooccurring_cases: 10
  require_fdr: false
  maximum_q_value: 0.05

node_criteria:
  minimum_valid_n: 500
  minimum_cases: 30

phase3:
  phase26_baseline:
    config_digest: 172713cfdaf6
    archive_directory: results/baselines/phase26_172713cfdaf6
    stable_rule_id: phi_012_stable
  primary_ses_definition: education_binary
  graph_definition:
    point_phi_threshold: 0.12
    bootstrap_selection_threshold: 0.12
    minimum_selection_stability: 0.90
  mining:
    backend: fast_gspan
    backend_version: 0.1.3
    support_fractions: [0.10, 0.20, 0.30]
    primary_support_fraction: 0.20
    minimum_nodes: 3
    maximum_nodes: 5
    connected: true
    induced: false
    undirected: true
    edge_label: 1
    threads: 4
  bootstrap:
    replicates: 500
    threshold: 0.12
    seed: 20240902
    discovery_reruns: true
    raw_threshold_sensitivity_reruns: true
    reporting_probability_cutpoints: [0.50, 0.80, 0.90]
  density_null:
    fixed_edge_replicates: 1000
    degree_preserving_replicates: 200
    swaps_per_edge: 10
    seed: 20240903
  ses_permutation:
    permutations: 9999
    seed: 20240904
    statistic: paired_density_residual_t
    multiplicity: [maxT, benjamini_hochberg]
    motif_scope: primary_support
  decision:
    phase26_retention: HOLD
    structural_feasibility: GO
    phase3_inference: exploratory

visualization:
  width: 9
  height: 7
  dpi: 160

viability:
  minimum_eligible_graphs: 80
  minimum_unique_edge_fraction: 0.5
  preferred_median_density_minimum: 0.05
  preferred_median_density_maximum: 0.50
  density_caution_threshold: 0.70
