registry_version: "0.1.0"

selection_policy:
  status: provisional
  required_years: [2023, 2024]
  minimum_national_weighted_prevalence: 0.02
  maximum_analytic_missing_fraction: 0.10
  require_comparable_core_measure: true

conditions:
  - canonical_name: ISCHEMIC_HEART_DISEASE
    label: Coronary heart disease or myocardial infarction
    source_by_year:
      "2023": _MICHD
      "2024": _MICHD
    coding:
      type: binary
      positive_values: [1]
      negative_values: [2]
      missing_values: [7, 9]
    primary: true

  - canonical_name: STROKE
