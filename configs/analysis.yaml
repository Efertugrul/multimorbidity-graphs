project:
  name: multimorbidity-motifs
  random_seed: 20240902

data:
  year: 2024
  raw_dir: data/raw/brfss
  audit_chunk_size: 50000
  expected_records:
    "2023": 433323
    "2024": 457670
  urls:
    "2023": https://www.cdc.gov/brfss/annual_data/2023/files/LLCP2023XPT.zip
    "2024": https://www.cdc.gov/brfss/annual_data/2024/files/LLCP2024XPT.zip

survey_design:
  state: _STATE
  weight: _LLCPWT
  strata: _STSTR
  psu: _PSU
  age_group: _AGE_G
  sex: _SEX

socioeconomic:
  active_definition: education_binary
  definitions:
    education_binary:
      label: Education-based provisional binary SES
      source_by_year:
        "2023": _EDUCAG
        "2024": _EDUCAG
      groups:
        lower: [1, 2]
        higher: [3, 4]
      missing_values: [9]
    income_binary:
      label: Income-based provisional binary SES
      source_by_year:
        "2023": _INCOMG1
        "2024": _INCOMG1
      groups:
        lower: [1, 2, 3, 4]
        higher: [5, 6, 7]
      missing_values: [9]

prototype:
  states: [6, 12, 26, 36, 48]
  minimum_population_n: 1000
  persist_harmonized: true

outputs:
  root: results
  interim: data/interim
