[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimorbidity-motifs"
version = "0.4.1"
description = "Population-specific multimorbidity graph and motif analysis from BRFSS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fast-gspan==0.1.3",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyreadstat>=1.2.7",
    "PyYAML>=6",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
multimorbidity-motifs = "mm_motifs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
